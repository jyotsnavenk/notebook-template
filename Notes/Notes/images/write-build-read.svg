<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 112" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>How a note becomes a page</title>
  <desc>Write, a markdown file in a folder, leads to Build, which scans folders and writes the manifest, which leads to Read, the rendered page with a section sidebar.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="rgba(0,0,0,0.4)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g fill="#111111" font-size="16" font-weight="500" text-anchor="middle" dominant-baseline="central">
    <text x="140" y="30">Write</text>
    <text x="340" y="30">Build</text>
    <text x="540" y="30">Read</text>
  </g>

  <g fill="rgba(0,0,0,0.4)" font-size="14" text-anchor="middle" dominant-baseline="central">
    <text x="140" y="56">Markdown file</text>
    <text x="140" y="74">in a folder</text>
    <text x="340" y="56">Scans folders,</text>
    <text x="340" y="74">writes manifest</text>
    <text x="540" y="56">Rendered page,</text>
    <text x="540" y="74">section sidebar</text>
  </g>

  <g stroke="rgba(0,0,0,0.4)" stroke-width="1" fill="none" marker-end="url(#arrow)">
    <line x1="180" y1="30" x2="296" y2="30"/>
    <line x1="380" y1="30" x2="500" y2="30"/>
  </g>
</svg>
