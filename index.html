<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Routing is path-based (e.g. /example-idea); this keeps relative asset
       and fetch URLs resolving from the site root on any route. -->
  <base href="/" />
  <title>Notebook</title>
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23A52A2A'/%3E%3C/svg%3E"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="/">↩ Index</a>
      <nav class="nav" id="nav"></nav>
    </aside>

    <main class="content" id="content">
      <a class="brand brand-top" href="/">↩ Index</a>
      <article class="note" id="note">
        <div class="empty-state">
          <p>Select a note from the sidebar to begin.</p>
        </div>
      </article>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
